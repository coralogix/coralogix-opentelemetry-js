# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Jfrog NPM publish

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - run: npm test
  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the JFrog exchange
    steps:
      - name: Set up JFrog CLI
        # Exchanges this job's GitHub OIDC JWT for a short-lived Artifactory token.
        # Replaces the JFROG_USER / JFROG_PASSWORD secret pair. The action calls
        # core.setSecret() on both outputs, so they stay masked in the log.
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://cgx.jfrog.io
        with:
          oidc-provider-name: github
          oidc-audience: jfrog-github
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag (v$TAG_VERSION)"
            exit 1
          fi
      - run: npm prune dev
      - name: Authenticate to the internal npm registry
        # /api/npm/<repo>/auth/<scope> returns a basic-auth npmrc: username=,
        # _password=, email=. An OIDC token authenticates as a transient identity
        # that has no username, so Artifactory cannot fill that field in and answers
        #   422 {"errors":[{"status":422,"message":"User must have a username"}]}
        # The trailing path segment is the npm scope, not a user - it plays no part
        # in the failure.
        #
        # _authToken is a bearer credential and needs no username, which is exactly
        # what the 422 says is missing. Same approach internal-staghorn uses.
        #
        # @coralogix:registry is kept because `npm publish` below resolves the
        # publish target for @coralogix/opentelemetry through it. always-auth is
        # not carried over: npm removed it in v9 and only warns about it now.
        run: |
          umask 077
          cat >> "$HOME/.npmrc" <<NPMRC
          @coralogix:registry=https://cgx.jfrog.io/artifactory/api/npm/internal.npm.coralogix.net/
          //cgx.jfrog.io/artifactory/api/npm/internal.npm.coralogix.net/:_authToken=${JFROG_TOKEN}
          NPMRC
        env:
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
      - run: npm publish --userconfig ~/.npmrc